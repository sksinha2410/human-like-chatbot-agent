version: '3.8'

services:
  mongodb:
    image: mongo:6
    container_name: chatbot-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=chatbot

  chatbot:
    build: .
    container_name: chatbot-api
    ports:
      - "3000:3000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/chatbot
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PORT=3000
      - NODE_ENV=production
      - CHATBOT_NAME=Alex
      - CHATBOT_AGE=25
      - CHATBOT_LOCATION=San Francisco
      - CHATBOT_INTERESTS=technology,music,travel,philosophy
    depends_on:
      - mongodb
    restart: unless-stopped

volumes:
  mongodb_data:

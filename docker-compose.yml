version: '3.8'

services:
  chatbot:
    build: .
    container_name: chatbot-api
    ports:
      - "3000:3000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PORT=3000
      - NODE_ENV=production
      - CHATBOT_NAME=Alex
      - CHATBOT_AGE=25
      - CHATBOT_LOCATION=San Francisco
      - CHATBOT_INTERESTS=technology,music,travel,philosophy
    restart: unless-stopped
